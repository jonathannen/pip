<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>pip</title>
    <meta name="description" content="Jon's personal bot: notes, code channels and an MCP server." />
    <meta name="theme-color" content="#fafafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- use-credentials: the manifest is behind Access, which needs the cookie; the default fetch sends none. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <!-- iOS: open from the home screen without browser chrome. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="pip" />
    <!-- Apply a saved theme before first paint; keep the key in sync with src/web/theme-switch.tsx. -->
    <script>
      try {
        const theme = localStorage.getItem("pip-theme");
        if (theme === "dark" || theme === "light") {
          document.documentElement.dataset.theme = theme;
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
